services:
  - type: web
    name: running-plan-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: INTERVALS_API_KEY
        sync: false
      - key: INTERVALS_ATHLETE_ID
        sync: false
      - key: RUNNER_NAME
        sync: false
      # Optional. Omit to use the current calendar year at runtime.
      - key: PLAN_YEAR
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
